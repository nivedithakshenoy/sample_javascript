name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - master
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 : true

jobs:
  build_and_package:
    name: BUILD-JOB
    runs-on: ubuntu-slim
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24 # Accepts '24', '24.x', or 'lts/*'
        cache: 'npm'

    - name: Build the code
      uses: npm install

    - name: Test
      uses: echo "code is tested!"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: production-build       # The downloadable name of the zip file
        path: ~/.npm                  # The directory or file path you want to upload
        #path: dist/
        retention-days: 7            # Optional: How long to keep it (default 90)
        compression-level: 6        
