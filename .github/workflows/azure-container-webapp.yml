name: Secure DevSecOps Pipeline

on:
  push:
    branches:
      - master
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 : true

jobs:
  build_and_package:
    name: BUILD-JOB
    runs-on: ubuntu-slim
    permissions:
      security-events: write
      contents: read
      actions: read
      
    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript-typescript', 'python' ]
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    
    - name: Set up Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24
    #     cache: 'npm'

    - name: Build the code
      run: npm install

    - name: Test
      run: echo "code is tested!"

    - name: Artifact upload 
      uses: actions/upload-artifact@v7 
      with: 
         name: artifact-1 
         retention-days: 7
         path: | 
             package*
